<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理员后台</title>
<style>
:root{
  --bg:#0b0b0d;
  --card:#191a1e;
  --tx:#f2f2f4;
  --mut:#b7b9c0;
  --ac:#173b8f;
  --ac2:#e2b92e;
  --line:#303238
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif
}

[hidden]{display:none!important}

.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  width:100%;
  max-width:400px
}

.box h1{
  margin:0 0 4px;
  font-size:22px;
  text-align:center
}

.box .sub{
  color:var(--mut);
  text-align:center;
  margin:0 0 18px;
  font-size:14px
}

label{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin:12px 0 4px
}

input,select,textarea{
  width:100%;
  padding:9px 11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#121316;
  color:var(--tx);
  font:inherit
}

textarea{
  min-height:70px;
  resize:vertical
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:9px 18px;
  background:var(--ac);
  color:#fff
}

button.sec{
  background:#292b31;
  color:#f2f2f4
}

button.danger{
  background:#e2b92e;
  color:#171717
}

button.sm{
  padding:3px 11px;
  font-size:13px
}

button:disabled{
  opacity:.5;
  cursor:wait
}

button:hover:not(:disabled){
  background:#e2b92e;
  color:#171717
}

button.sec:hover:not(:disabled){
  background:#173b8f;
  color:#fff
}

input:hover,select:hover,textarea:hover{
  border-color:#526b9e
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#e2b92e;
  box-shadow:0 0 0 2px rgba(226,185,46,.16)
}

select option{
  background:#191a1e;
  color:#f2f2f4
}

select option:checked{
  background:#173b8f;
  color:#fff
}

.full{
  width:100%;
  margin-top:18px
}

.err{
  color:#ff7777;
  font-size:13px;
  min-height:18px;
  margin-top:8px;
  text-align:center
}

.hint{
  font-size:12px;
  color:var(--mut);
  margin-top:4px
}

.link{
  background:none;
  color:var(--mut);
  text-decoration:underline;
  padding:0;
  font-size:12px;
  display:block;
  margin:14px auto 0
}

/* app */

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:18px 14px 80px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px
}

.top h1{
  font-size:20px;
  margin:0
}

section{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin-top:18px
}

section h2{
  margin:0 0 6px;
  font-size:17px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 12px
}

.grid .span{
  grid-column:1/-1
}

.row{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 0;
  border-top:1px solid var(--line)
}

.row .info{
  flex:1;
  min-width:0
}

.row .info b{
  display:block
}

.row .info span{
  color:var(--mut);
  font-size:13px;
  word-break:break-all
}

.row .btns{
  display:flex;
  gap:6px;
  flex-shrink:0
}

.thumb{
  width:72px;
  height:44px;
  border-radius:6px;
  background:#000 center/cover;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px
}

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:#292b31;
  border:1px solid var(--line);
  padding:10px 18px;
  border-radius:10px;
  z-index:9;
  max-width:90vw;
  display:none
}

#toast.bad{
  background:#5a1f2b;
  border-color:#8b3545
}

.tip{
  font-size:13px;
  color:var(--mut);
  margin:0 0 4px
}

@media(max-width:560px){
  .grid{
    grid-template-columns:1fr
  }
}

</style>
</head>
<body>

<!-- 锁屏 -->
<div class="center" id="lock" hidden>
  <div class="box">
    <h1>🔒 Only for 管理员</h1>
    <p class="sub">请输入管理员密码进入后台</p>
    <input type="password" id="pw" placeholder="管理员密码" autocomplete="current-password">
    <div class="err" id="lockErr"></div>
    <button class="full" id="loginBtn">进入</button>
    <button class="link" id="resetBtn">忘记密码 / 重新设置</button>
  </div>
</div>

<!-- 首次设置 -->
<div class="center" id="setup" hidden>
  <div class="box" style="max-width:460px">
    <h1>🔒 Only for 管理员</h1>
    <p class="sub">首次使用（或换了新设备）需要设置一次</p>
    <label>GitHub 仓库（用户名/仓库名）</label>
    <input id="repo" placeholder="例如 yourname/idol-schedule">
    <label>GitHub 访问令牌（Token）</label>
    <input type="password" id="token" placeholder="github_pat_xxxxxxxx" autocomplete="off">
    <div class="hint">只需要这个仓库的 Contents 读写权限，详见 README。</div>
    <label>设置管理员密码（本设备以后只需输这个）</label>
    <input type="password" id="pw1" placeholder="至少 6 位" autocomplete="new-password">
    <input type="password" id="pw2" placeholder="再输一次" autocomplete="new-password" style="margin-top:8px">
    <div class="err" id="setupErr"></div>
    <button class="full" id="setupBtn">保存并进入</button>
    <div class="hint" style="text-align:center;margin-top:10px">令牌会用你的密码加密后只存在这台设备的浏览器里。</div>
  </div>
</div>

<!-- 后台 -->
<div class="wrap" id="app" hidden>
  <div class="top"><h1>🛠 管理员后台</h1><button class="sec sm" id="logout">退出</button></div>
  <p class="tip">每次添加/修改/删除都会立即发布，访客页面约 1 分钟内自动更新。</p>

  <section>
    <h2>站点设置</h2>
    <div class="grid">
      <div><label>网站标题</label><input id="sTitle" placeholder="例如：XXX 行程表"></div>
      <div><label>偶像名字 / 副标题</label><input id="sIdol" placeholder="例如：XXX Official Fan Site"></div>
    </div>
    <button style="margin-top:12px" id="sSave">保存设置</button>
  </section>

  <section>
    <h2 id="fTitle">添加行程</h2>
    <div class="grid">
      <div class="span"><label>标题 *</label><input id="xTitle" placeholder="例如：XXX 首尔演唱会 Day 1"></div>
      <div><label>日期 *</label><input type="date" id="xDate"></div>
      <div><label>类型</label><input id="xCat" list="cats" placeholder="演唱会 / 综艺 / 见面会…"><datalist id="cats"><option>演唱会</option><option>综艺</option><option>见面会</option><option>拍摄</option><option>直播</option><option>颁奖典礼</option><option>机场</option><option>其他</option></datalist></div>
      <div><label>开始时间</label><input type="time" id="xTime"></div>
      <div><label>结束时间（可选）</label><input type="time" id="xEnd"></div>
      <div class="span"><label>地点</label><input id="xLoc" placeholder="例如：KSPO Dome, Seoul"></div>
      <div class="span"><label>详情</label><textarea id="xDet" placeholder="入场时间、注意事项、票务信息等"></textarea></div>
      <div class="span"><label>相关链接（可选）</label><input id="xLink" placeholder="https://…"></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button id="xSave">添加行程</button>
      <button class="sec" id="xCancel" hidden>取消编辑</button>
    </div>
  </section>

  <section>
    <h2>已有行程 <span id="xCount" style="color:var(--mut);font-size:13px"></span></h2>
    <div id="xList"></div>
  </section>

  <section>
    <h2>添加轮播内容（MV / 预告 / 海报）</h2>
    <div class="grid">
      <div class="span"><label>内容类型</label>
        <select id="hKind">
          <option value="upload-image">上传图片</option>
          <option value="upload-video">上传视频（小文件）</option>
          <option value="youtube">YouTube 链接</option>
          <option value="bilibili">B站 链接</option>
          <option value="url-image">图片网址</option>
          <option value="url-video">视频网址（mp4 直链）</option>
        </select>
      </div>
      <div class="span" id="hFileBox"><label>选择文件</label><input type="file" id="hFile"><div class="hint" id="hFileHint">图片会自动压缩到最长边 1600px。</div></div>
      <div class="span" id="hUrlBox" hidden><label id="hUrlLabel">链接</label><input id="hUrl" placeholder="https://…"></div>
      <div><label>标题</label><input id="hTitle" placeholder="例如：新单曲 MV 公开"></div>
      <div><label>副标题（可选）</label><input id="hSub" placeholder="例如：11/10 全网上线"></div>
      <div><label>停留秒数（可选，视频上传默认播完）</label><input type="number" id="hDur" min="2" max="120" placeholder="图片默认 5 秒，嵌入视频默认 12 秒"></div>
    </div>
    <button style="margin-top:14px" id="hAdd">添加到轮播</button>
  </section>

  <section>
    <h2>当前轮播 <span id="hCount" style="color:var(--mut);font-size:13px"></span></h2>
    <div id="hList"></div>
  </section>
</div>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder(),dec=new TextDecoder();
const LS='idol_admin_v1';
const API='https://api.github.com';
const MAX_UPLOAD=40*1024*1024;

/* ---------- base64 / 加密 ---------- */
function u8ToB64(u){let s='';const c=0x8000;for(let i=0;i<u.length;i+=c)s+=String.fromCharCode.apply(null,u.subarray(i,i+c));return btoa(s);}
function b64ToU8(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function deriveKey(pw,salt){
  const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
  return JSON.stringify({s:u8ToB64(salt),i:u8ToB64(iv),c:u8ToB64(new Uint8Array(ct))});
}
async function unseal(str,pw){
  const o=JSON.parse(str);
  const k=await deriveKey(pw,b64ToU8(o.s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToU8(o.i)},k,b64ToU8(o.c));
  return JSON.parse(dec.decode(pt));
}

/* ---------- GitHub API ---------- */
let cfg=null,DATA=null,sha=null,editingId=null;
async function gh(path,opt={}){
  const r=await fetch(API+path,{cache:'no-store',...opt,headers:{
    'Authorization':'Bearer '+cfg.token,
    'Accept':'application/vnd.github+json',
    'Content-Type':'application/json',
    ...(opt.headers||{})}});
  if(!r.ok){let t='';try{t=(await r.json()).message}catch{}throw new Error(r.status+' '+t);}
  return r.status===204?null:r.json();
}
const emptyData=()=>({site:{title:'行程表',idol:''},schedule:[],highlights:[]});
async function loadData(){
  try{
    const j=await gh(`/repos/${cfg.repo}/contents/data.json`);
    sha=j.sha;
    DATA=JSON.parse(dec.decode(b64ToU8(j.content.replace(/\n/g,''))));
  }catch(e){
    if(String(e.message).startsWith('404')){sha=null;DATA=emptyData();}else throw e;
  }
  DATA.site=DATA.site||{};DATA.schedule=DATA.schedule||[];DATA.highlights=DATA.highlights||[];
}
async function saveData(msg){
  const body={message:msg,content:u8ToB64(enc.encode(JSON.stringify(DATA,null,2)))};
  if(sha)body.sha=sha;
  const j=await gh(`/repos/${cfg.repo}/contents/data.json`,{method:'PUT',body:JSON.stringify(body)});
  sha=j.content.sha;
}
async function uploadFile(blob,name){
  if(blob.size>MAX_UPLOAD)throw new Error('文件超过 40MB，请改用 YouTube / B站 链接');
  const safe=Date.now()+'-'+name.replace(/[^\w.\-]+/g,'_');
  const buf=new Uint8Array(await blob.arrayBuffer());
  await gh(`/repos/${cfg.repo}/contents/uploads/${safe}`,{method:'PUT',body:JSON.stringify({message:'upload '+safe,content:u8ToB64(buf)})});
  return 'uploads/'+safe;
}
async function deleteUpload(src){
  if(!/^uploads\//.test(src||''))return;
  try{
    const j=await gh(`/repos/${cfg.repo}/contents/${src}`);
    await gh(`/repos/${cfg.repo}/contents/${src}`,{method:'DELETE',body:JSON.stringify({message:'delete '+src,sha:j.sha})});
  }catch{}
}
async function prepImage(file){
  if(!file.type.startsWith('image/')||file.type==='image/gif')return {blob:file,name:file.name};
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);
  g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
  return {blob,name:file.name.replace(/\.\w+$/,'')+'.jpg'};
}

/* ---------- 提示 / 队列 ---------- */
let toastTimer;
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',bad?6000:3500);}
let chain=Promise.resolve();
function run(fn){
  chain=chain.then(async()=>{
    toast('正在发布…');
    try{await fn();render();toast('已发布 ✓ 访客约 1 分钟后可见');}
    catch(e){toast('失败：'+e.message,true);try{await loadData();render();}catch{}}
  });
  return chain;
}

/* ---------- 登录流程 ---------- */
function showView(id){['lock','setup','app'].forEach(x=>$('#'+x).hidden=x!==id);}
function boot(){showView(localStorage.getItem(LS)?'lock':'setup');}
async function enter(){
  showView('app');
  try{await loadData();render();}
  catch(e){toast('读取数据失败：'+e.message,true);}
}
$('#loginBtn').onclick=async()=>{
  $('#lockErr').textContent='';
  try{cfg=await unseal(localStorage.getItem(LS),$('#pw').value);}
  catch{$('#lockErr').textContent='密码错误';return;}
  $('#pw').value='';
  enter();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#resetBtn').onclick=()=>{
  if(confirm('将清除本设备保存的令牌，需要重新填写仓库和令牌。确定吗？')){localStorage.removeItem(LS);boot();}
};
$('#setupBtn').onclick=async()=>{
  const err=$('#setupErr');err.textContent='';
  const repo=$('#repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const token=$('#token').value.trim(),p1=$('#pw1').value,p2=$('#pw2').value;
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){err.textContent='仓库格式应为 用户名/仓库名';return;}
  if(!token){err.textContent='请填写令牌';return;}
  if(p1.length<6){err.textContent='密码至少 6 位';return;}
  if(p1!==p2){err.textContent='两次密码不一致';return;}
  $('#setupBtn').disabled=true;
  try{
    cfg={repo,token};
    const r=await gh('/repos/'+repo);
    if(r.permissions&&!r.permissions.push)throw new Error('这个令牌没有该仓库的写入权限');
    localStorage.setItem(LS,await seal(cfg,p1));
    $('#token').value='';$('#pw1').value='';$('#pw2').value='';
    enter();
  }catch(e){cfg=null;err.textContent='验证失败：'+e.message;}
  $('#setupBtn').disabled=false;
};
$('#logout').onclick=()=>{cfg=null;DATA=null;sha=null;showView('lock');};

/* ---------- 渲染 ---------- */
const KIND={image:'图片',video:'视频',youtube:'YouTube',bilibili:'B站'};
function render(){
  $('#sTitle').value=DATA.site.title||'';
  $('#sIdol').value=DATA.site.idol||'';
  const list=[...DATA.schedule].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  $('#xCount').textContent=`(${list.length})`;
  $('#xList').innerHTML=list.length?list.map(x=>`
    <div class="row"><div class="info"><b>${esc(x.title)}${x.category?' · '+esc(x.category):''}</b>
    <span>${esc(x.date)} ${esc(x.time||'全天')}${x.endTime?'–'+esc(x.endTime):''}${x.location?' ｜ '+esc(x.location):''}</span></div>
    <div class="btns"><button class="sec sm" data-edit="${esc(x.id)}">编辑</button><button class="danger sm" data-del="${esc(x.id)}">删除</button></div></div>`).join(''):'<p class="tip">还没有行程</p>';
  const hs=DATA.highlights;
  $('#hCount').textContent=`(${hs.length})`;
  $('#hList').innerHTML=hs.length?hs.map((h,k)=>{
    const thumb=h.kind==='image'?`<div class="thumb" style="background-image:url('${esc(h.src)}')"></div>`:`<div class="thumb">${h.kind==='video'?'🎞':'▶️'}</div>`;
    return `<div class="row">${thumb}<div class="info"><b>${esc(h.title||'(无标题)')}</b><span>${KIND[h.kind]||h.kind}${h.subtitle?' ｜ '+esc(h.subtitle):''}</span></div>
    <div class="btns"><button class="sec sm" data-up="${k}" ${k===0?'disabled':''}>↑</button><button class="sec sm" data-down="${k}" ${k===hs.length-1?'disabled':''}>↓</button><button class="danger sm" data-hdel="${k}">删除</button></div></div>`;
  }).join(''):'<p class="tip">轮播还是空的，访客页面不会显示轮播区域</p>';
}

/* ---------- 站点设置 ---------- */
$('#sSave').onclick=()=>{
  DATA.site.title=$('#sTitle').value.trim();DATA.site.idol=$('#sIdol').value.trim();
  run(()=>saveData('update site settings'));
};

/* ---------- 行程 ---------- */
function resetForm(){
  editingId=null;
  ['xTitle','xDate','xCat','xTime','xEnd','xLoc','xDet','xLink'].forEach(i=>$('#'+i).value='');
  $('#fTitle').textContent='添加行程';$('#xSave').textContent='添加行程';$('#xCancel').hidden=true;
}
$('#xCancel').onclick=resetForm;
$('#xSave').onclick=()=>{
  const title=$('#xTitle').value.trim(),date=$('#xDate').value;
  if(!title||!date){toast('标题和日期必填',true);return;}
  const link=$('#xLink').value.trim();
  if(link&&!/^https?:\/\//i.test(link)){toast('链接必须以 http:// 或 https:// 开头',true);return;}
  const item={id:editingId||('s'+Date.now()),title,date,time:$('#xTime').value,endTime:$('#xEnd').value,
    location:$('#xLoc').value.trim(),category:$('#xCat').value.trim(),details:$('#xDet').value.trim(),link};
  const isEdit=!!editingId;
  if(isEdit){const k=DATA.schedule.findIndex(x=>x.id===editingId);if(k>=0)DATA.schedule[k]=item;else DATA.schedule.push(item);}
  else DATA.schedule.push(item);
  resetForm();
  run(()=>saveData((isEdit?'edit':'add')+' schedule: '+title));
};
$('#xList').onclick=e=>{
  const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');
  if(ed){
    const x=DATA.schedule.find(i=>i.id===ed.dataset.edit);if(!x)return;
    editingId=x.id;
    $('#xTitle').value=x.title;$('#xDate').value=x.date;$('#xCat').value=x.category||'';
    $('#xTime').value=x.time||'';$('#xEnd').value=x.endTime||'';$('#xLoc').value=x.location||'';
    $('#xDet').value=x.details||'';$('#xLink').value=x.link||'';
    $('#fTitle').textContent='编辑行程';$('#xSave').textContent='保存修改';$('#xCancel').hidden=false;
    $('#fTitle').scrollIntoView({behavior:'smooth'});
  }
  if(del){
    const x=DATA.schedule.find(i=>i.id===del.dataset.del);if(!x)return;
    if(!confirm('删除「'+x.title+'」？'))return;
    DATA.schedule=DATA.schedule.filter(i=>i.id!==x.id);
    if(editingId===x.id)resetForm();
    run(()=>saveData('delete schedule: '+x.title));
  }
};

/* ---------- 轮播 ---------- */
function syncKind(){
  const k=$('#hKind').value,file=k.startsWith('upload'),box=$('#hFileBox');
  box.hidden=!file;$('#hUrlBox').hidden=file;
  $('#hFile').accept=k==='upload-image'?'image/*':'video/*';
  $('#hFileHint').textContent=k==='upload-image'?'图片会自动压缩到最长边 1600px。':'视频建议 40MB 以内（越小越好）；大视频请用 YouTube / B站 链接。';
  $('#hUrlLabel').textContent={youtube:'YouTube 视频链接',bilibili:'B站 视频链接（含 BV 号）','url-image':'图片网址','url-video':'视频直链（.mp4）'}[k]||'链接';
}
$('#hKind').onchange=syncKind;syncKind();
$('#hAdd').onclick=()=>{
  const k=$('#hKind').value,file=$('#hFile').files[0],url=$('#hUrl').value.trim();
  const title=$('#hTitle').value.trim(),subtitle=$('#hSub').value.trim(),dur=Number($('#hDur').value)||0;
  if(k.startsWith('upload')&&!file){toast('请先选择文件',true);return;}
  if(!k.startsWith('upload')){
    if(!/^https?:\/\//i.test(url)){toast('请填写以 http(s):// 开头的链接',true);return;}
    if(k==='youtube'&&!/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/.test(url)){toast('无法识别这个 YouTube 链接',true);return;}
    if(k==='bilibili'&&!/BV\w+/.test(url)){toast('无法识别 B站 链接，需要包含 BV 号',true);return;}
  }
  const kind={'upload-image':'image','url-image':'image','upload-video':'video','url-video':'video',youtube:'youtube',bilibili:'bilibili'}[k];
  ['hFile','hUrl','hTitle','hSub','hDur'].forEach(i=>$('#'+i).value='');
  $('#hAdd').disabled=true;
  run(async()=>{
    let src=url;
    if(k==='upload-image'){const p=await prepImage(file);src=await uploadFile(p.blob,p.name);}
    else if(k==='upload-video'){src=await uploadFile(file,file.name);}
    const h={id:'h'+Date.now(),kind,src,title,subtitle};
    if(dur)h.duration=dur;
    DATA.highlights.push(h);
    await saveData('add highlight: '+(title||kind));
  }).finally(()=>{$('#hAdd').disabled=false;});
};
$('#hList').onclick=e=>{
  const up=e.target.closest('[data-up]'),dn=e.target.closest('[data-down]'),del=e.target.closest('[data-hdel]');
  const hs=DATA.highlights;
  if(up||dn){
    const k=Number((up||dn).dataset[up?'up':'down']),j=up?k-1:k+1;
    if(j<0||j>=hs.length)return;
    [hs[k],hs[j]]=[hs[j],hs[k]];
    run(()=>saveData('reorder highlights'));
  }
  if(del){
    const k=Number(del.dataset.hdel),h=hs[k];if(!h)return;
    if(!confirm('从轮播中删除「'+(h.title||'此项')+'」？'))return;
    hs.splice(k,1);
    run(async()=>{await saveData('delete highlight: '+(h.title||h.kind));await deleteUpload(h.src);});
  }
};

boot();
</script>
</body>
</html>
