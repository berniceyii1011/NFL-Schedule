<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>偶像行程表</title>
<style>
:root{
  --bg:#0b0b0d;
  --card:#191a1e;
  --tx:#ffffff;
  --mut:#ffffff;
  --ac:#173b8f;
  --ac2:#173b8f;
  --line:#303238
}
*{box-sizing:border-box}
  
body{
  margin:0;
  background:var(--bg);
  color:#ffffff;
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:url("images/Image_20261104181027_123_1.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:0.28;
  pointer-events:none;
}
[hidden]{display:none!important}
header{padding:44px 16px 28px;text-align:center;background:linear-gradient(135deg,#173b8f,#0b0b0d);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:28px;color:#ffffff}
header p{margin:6px 0 0;color:#ffffff;opacity:.9}
main{max-width:860px;margin:0 auto;padding:20px 14px 60px}
h2{font-size:20px;margin:28px 0 12px;color:#ffffff}

/* carousel */
.carousel{position:relative;overflow:hidden;border-radius:16px;background:#000;border:1px solid var(--line);aspect-ratio:16/9;user-select:none}
.track{display:flex;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.slide{min-width:100%;height:100%;position:relative;background:#000}
.slide img,.slide video,.slide iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.slide video{object-fit:contain}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none;color:#ffffff}
.cap b{display:block;font-size:18px}
.cap span{font-size:13px;opacity:.9}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(23,59,143,.8);color:#ffffff;font-size:22px;cursor:pointer;z-index:2}
.nav:hover{background:#254fa8}
.nav.prev{left:10px}.nav.next{right:10px}
.dots{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dots i.on{background:#ffffff;width:20px;border-radius:4px}

/* schedule */
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{font:inherit;background:var(--card);color:#ffffff;border:1px solid var(--line);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:14px}
.tabs button:hover{background:#254fa8;border-color:#526b9e}
.tabs button.on{background:var(--ac);border-color:#526b9e}
.day h3{font-size:15px;color:#ffffff;margin:18px 0 8px;font-weight:600}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item:hover{border-color:#526b9e}
.time{min-width:64px;font-weight:700;font-size:17px;color:#ffffff}
.time small{display:block;color:#ffffff;opacity:.75;font-weight:400;font-size:12px}
.body{flex:1;min-width:0}
.body h4{margin:0 0 4px;font-size:16px;color:#ffffff}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:var(--ac);color:#ffffff;margin-left:6px;vertical-align:1px}
.meta{color:#ffffff;font-size:14px}
.meta a{color:#ffffff}
.details{margin-top:6px;font-size:14px;white-space:pre-wrap;word-break:break-word;color:#ffffff}
.btn{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:14px;background:var(--ac);color:#ffffff;text-decoration:none;font-size:13px}
.btn:hover{background:#254fa8}
.badge{background:var(--ac);color:#ffffff;font-size:12px;padding:1px 8px;border-radius:10px;margin-left:6px}
.badge.b2{background:#254fa8}
.poster{width:96px;height:128px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex-shrink:0;align-self:flex-start;background:#000}
.poster:hover{border-color:#526b9e}
.empty{color:#ffffff;opacity:.75;text-align:center;padding:30px 0}

.artists{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.artist{font-size:12px;padding:1px 10px;border-radius:10px;border:1px solid #526b9e;background:rgba(23,59,143,.35);color:#ffffff}

/* 海报放大 */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:10px}

@media(max-width:520px){
  .item{flex-direction:column;gap:4px}
  header h1{font-size:23px}
  .poster{width:100%;height:auto;max-height:420px;object-fit:contain}
}
</style>
</head>
<body>
<header>
  <h1 id="siteTitle">行程表</h1>
  <p id="idolName"></p>
</header>
<main>
  <section id="hlSection" hidden>
    <h2>🎬 最新推荐</h2>
    <div class="carousel" id="car">
      <div class="track" id="track"></div>
      <button class="nav prev" id="prev" aria-label="上一个">‹</button>
      <button class="nav next" id="next" aria-label="下一个">›</button>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <section>
    <h2>📅 行程</h2>
    <div class="tabs" id="tabs">
      <button data-tab="upcoming" class="on">即将到来</button>
      <button data-tab="past">已结束</button>
      <button data-tab="all">全部</button>
    </div>
    <div id="list"><p class="empty">加载中…</p></div>
  </section>
</main>
<div id="lb"><img id="lbImg" alt="活动海报"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const mediaSrc=s=>/^uploads\//.test(s||'')?s:safeUrl(s);
let DATA={site:{},schedule:[],highlights:[]},tab='upcoming';

const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmt(new Date());
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return fmt(new Date(y,m-1,d+n));}
function dateLabel(d){
  const [y,m,dd]=d.split('-').map(Number);
  const w='日一二三四五六'[new Date(y,m-1,dd).getDay()];
  let tag='';
  if(d===today())tag='<span class="badge">今天</span>';
  else if(d===addDays(today(),1))tag='<span class="badge b2">明天</span>';
  return `${y}年${m}月${dd}日 周${w}${tag}`;
}

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;init();})
  .catch(()=>{$('#list').innerHTML='<p class="empty">数据加载失败，请稍后刷新</p>';});

function init(){
  const s=DATA.site||{};
  $('#siteTitle').textContent=s.title||'行程表';
  $('#idolName').textContent=s.idol||'';
  document.title=s.title||'行程表';
  renderList();
  initCarousel();
}

/* ---------- 行程 ---------- */
function card(x){
  const time=x.time?esc(x.time)+(x.endTime?`<small>– ${esc(x.endTime)}</small>`:''):'全天';
  const loc=x.location?`<div class="meta">📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.location)}">${esc(x.location)}</a></div>`:'';
  const chip=x.category?`<span class="chip">${esc(x.category)}</span>`:'';
  const det=x.details?`<div class="details">${esc(x.details)}</div>`:'';
  const btn=safeUrl(x.link)?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.link)}">查看详情 →</a>`:'';
  const art=(x.artists&&x.artists.length)?`<div class="artists">${x.artists.map(n=>`<span class="artist">🎤 ${esc(n)}</span>`).join('')}</div>`:'';
  const ps=mediaSrc(x.image);
  const poster=ps?`<img class="poster" loading="lazy" src="${esc(ps)}" alt="${esc(x.title)} 海报">`:'';
  return `<div class="item"><div class="time">${time}</div><div class="body"><h4>${esc(x.title)}${chip}</h4>${art}${loc}${det}${btn}</div>${poster}</div>`;
}
function renderList(){
  const t=today();
  let items=[...(DATA.schedule||[])].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(tab==='upcoming')items=items.filter(x=>x.date>=t);
  else if(tab==='past')items=items.filter(x=>x.date<t).reverse();
  if(!items.length){$('#list').innerHTML='<p class="empty">暂无行程</p>';return;}
  let html='',last='';
  for(const x of items){
    if(x.date!==last){if(last)html+='</div>';html+=`<div class="day"><h3>${dateLabel(x.date)}</h3>`;last=x.date;}
    html+=card(x);
  }
  $('#list').innerHTML=html+'</div>';
}
$('#list').onclick=e=>{
  const p=e.target.closest('.poster');if(!p)return;
  $('#lbImg').src=p.src;$('#lb').style.display='flex';
};
$('#lb').onclick=()=>{$('#lb').style.display='none';$('#lbImg').removeAttribute('src');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').click();});
$('#tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  tab=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  renderList();
};

/* ---------- 轮播 ---------- */
function embedUrl(h){
  const u=h.src||'';let m;
  if(h.kind==='youtube'){
    m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    if(m)return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1&rel=0`;
  }
  if(h.kind==='bilibili'){
    m=u.match(/BV[\w]+/);
    if(m)return `https://player.bilibili.com/player.html?bvid=${m[0]}&autoplay=1&muted=1&high_quality=1`;
  }
  return '';
}
function slideHtml(h){
  const cap=(h.title||h.subtitle)?`<div class="cap">${h.title?`<b>${esc(h.title)}</b>`:''}${h.subtitle?`<span>${esc(h.subtitle)}</span>`:''}</div>`:'';
  let inner='';
  if(h.kind==='image'){const s=mediaSrc(h.src);inner=s?`<img src="${esc(s)}" alt="${esc(h.title)}">`:'';}
  else if(h.kind==='video'){const s=mediaSrc(h.src);inner=s?`<video muted playsinline preload="metadata" src="${esc(s)}"></video>`:'';}
  else{const e=embedUrl(h);inner=e?`<iframe data-src="${esc(e)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:'';}
  return `<div class="slide">${inner}${cap}</div>`;
}
function initCarousel(){
  const hs=DATA.highlights||[];
  if(!hs.length)return;
  $('#hlSection').hidden=false;
  const track=$('#track');
  track.innerHTML=hs.map(slideHtml).join('');
  const slides=[...track.children];
  $('#dots').innerHTML=hs.map((_,k)=>`<i data-k="${k}"></i>`).join('');
  const dots=[...$('#dots').children];
  let i=0,timer;
  const single=hs.length===1;
  if(single){$('#prev').hidden=$('#next').hidden=$('#dots').hidden=true;}

  function next(){go(i+1);}
  function go(n){
    i=(n+hs.length)%hs.length;
    track.style.transform=`translateX(-${i*100}%)`;
    dots.forEach((d,k)=>d.classList.toggle('on',k===i));
    activate();
  }
  function activate(){
    clearTimeout(timer);
    slides.forEach((s,k)=>{
      const v=s.querySelector('video'),f=s.querySelector('iframe');
      if(k===i){
        if(v){v.currentTime=0;v.play().catch(()=>{});}
        if(f&&!f.getAttribute('src'))f.src=f.dataset.src;
      }else{
        if(v)v.pause();
        if(f&&f.getAttribute('src'))f.removeAttribute('src');
      }
    });
    const h=hs[i],v=slides[i].querySelector('video');
    if(v){
      if(single){v.loop=true;return;}
      v.onended=next;
      timer=setTimeout(next,120000);
    }else if(!single){
      timer=setTimeout(next,(Number(h.duration)||(h.kind==='image'?5:12))*1000);
    }
  }
  $('#prev').onclick=()=>go(i-1);
  $('#next').onclick=()=>go(i+1);
  $('#dots').onclick=e=>{const d=e.target.closest('i');if(d)go(Number(d.dataset.k));};
  let sx=null;
  const car=$('#car');
  car.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  car.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50)go(dx<0?i+1:i-1);
  });
  go(0);
}
</script>
</body>
</html>
